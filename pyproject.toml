[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advance-rag-multidoc-chatbot"
version = "0.1.0"
description = "Advanced RAG Multi-Document Chatbot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openpyxl",
    "python-docx",
    "pypdf",
    "pymupdf",
    "langchain-text-splitters",
    "sentence-transformers",
    "huggingface_hub",
    "numpy",
    "langchain",
    "langchain_classic",
    "langchain-qdrant",
    "qdrant-client",
    "langchain-community",
    "langchain-huggingface",
    "langchain-core",
    "unstructured",
    "bitsandbytes>=0.46.1",
    "accelerate",
    "langsmith",
    "langchain-google-genai",
    "langchain-openai",
    "fastapi",
    "uvicorn",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg-binary",
    "psycopg-pool",
    "torch",
    "prometheus-client",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv",
    "rank-bm25",
    "alembic"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pip-tools"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evals*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "routing: marks tests that execute the real-LLM routing evaluation suite (excluded by default, run with -m routing)",
]

