<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced RAG Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header>
    <h1>Advanced <span>RAG</span> Chatbot</h1>
    <div class="header-right">
      <div id="health-dot" title="API health"></div>
      <div id="thread-pill">no session</div>
      <button id="btn-new">＋ New chat</button>
    </div>
  </header>

  <!-- ── Salesforce config bar ──────────────────────────────────────────── -->
  <div id="config-bar">
    <label for="sf-username">Salesforce user (optional):</label>
    <input
      id="sf-username"
      type="text"
      placeholder="user@example.com"
      autocomplete="off"
    />
  </div>

  <!-- ── Chat messages ──────────────────────────────────────────────────── -->
  <div id="chat-wrap">
    <div id="empty-state" style="display:flex; flex-direction:column; align-items:center;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none"
           stroke="#6366f1" stroke-width="1.4" stroke-linecap="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Ask anything — documents, Salesforce, or general questions.</p>
    </div>
  </div>

  <!-- ── Salesforce approval panel (hidden by default) ─────────────────── -->
  <div id="approval-panel">
    <h3>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94
                 a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      Approval Required
    </h3>
    <div id="approval-details"></div>
    <div class="approval-actions">
      <button class="btn-approve" id="btn-approve">✅ Approve</button>
      <button class="btn-reject"  id="btn-reject" >❌ Reject</button>
    </div>
  </div>

  <!-- ── Input bar ──────────────────────────────────────────────────────── -->
  <div id="input-bar">
    <textarea
      id="question"
      rows="1"
      placeholder="Type your question… (Enter to send, Shift+Enter for newline)"
    ></textarea>
    <button id="btn-send" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <footer>Advanced RAG Chatbot · <a href="/docs" style="color:inherit">API Docs</a></footer>

  <script src="/ui/app.js"></script>
</body>
</html>
